<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- 1. LOAD LIBRARIES: These are the "tools" we need -->
    <!-- This loads p5.js (helps with camera and drawing) -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ml5@0.12.2/dist/ml5.min.js"></script>
    <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="top-bar">
    <div class="logo">
        <img src="logo.png" alt="変顔 de じゃんけん" class="main-logo">
    </div>
    <div class="instructions">
        <div class="asobikata">
            <h3>遊び方:</h3>
        </div>
        <div class="howto">
            <table>
                <tr>
                    <td id="hand"><strong>✊ぐー　:</strong></td>
                    <td>😗口をすぼめよう</td>
                <tr>
                    <td id="hand"><strong>✌ちょき:</strong></td>
                    <td>😏ウィンクをしてみてね</td>
                <tr>
                    <td id="hand"><strong>✋ぱー　:</strong></td>
                    <td>😮口を大きく開けてみて</td>
            </table>
        </div>
    </div>
    <div class="start">
        <div id="button">
            <button id="start">始める!</button><br>
        </div>
        <div class="status-box">
            <span id="status">Status: <br>AI読み込み中…<br>ちょっと待ってね。</span>
        </div>
    </div>
</div>

    <div class="main-container">
        <div id="video-column">
            <h3>あなたの顔</h3>
            <!-- p5.js will insert the canvas right here -->
            <span id="myfinalhand">私の手</span>
        </div>
        <div id="vs-container">VS</div>
        <div id="emoji-column">
            <h3>パソコンの顔</h3>
            <div id="emoji-display">...⌛</div>
            <span id="pcfinalhand">パソコンの手</span>            
        </div>
    </div>

    <!-- The p5.js library will automatically inject the camera canvas right here -->

    <div id="counter">結果:</div>

    <!-- 2. LOAD YOUR CODE: This must come AFTER the libraries above -->
    <script src="facetry.js"></script>

</body>
</html>
