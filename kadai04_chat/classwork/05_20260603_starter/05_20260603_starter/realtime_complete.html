<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Firebase:v9:Chatアプリ</title>
    <style>
      body {
        font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: #eef1f6;
        color: #20242e;
        margin: 0;
        padding: 28px 14px;
      }
      .chat {
        max-width: 440px;
        margin: 0 auto;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 8px 26px rgba(31, 41, 84, 0.12);
        padding: 22px;
      }
      .chat::before {
        content: "💬 Chat";
        display: block;
        font-weight: 700;
        font-size: 1.05rem;
        margin-bottom: 14px;
      }
      .chat > div {
        margin-bottom: 10px;
      }
      .chat input[type="text"] {
        width: 60%;
        border: 1px solid #cbd3e1;
        border-radius: 8px;
        padding: 7px 10px;
        font: inherit;
        font-size: 0.92rem;
      }
      .chat textarea {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #cbd3e1;
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
        font-size: 0.92rem;
        resize: vertical;
      }
      .chat button {
        display: block;
        margin-top: 8px;
        margin-left: auto;
        background: #2d4084;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 8px 22px;
        font: inherit;
        font-size: 0.92rem;
        cursor: pointer;
      }
      .chat button:hover {
        background: #243466;
      }
      #output {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #output p {
        margin: 0;
        background: #eef2ff;
        border-radius: 10px;
        padding: 9px 12px;
        font-size: 0.9rem;
        line-height: 1.55;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <!-- コンテンツ表示画面 -->
    <div class="chat">
      <div>名前：<input type="text" id="userName" /></div>
      <div>
        <textarea id="text" cols="30" rows="10"></textarea>
        <button id="send">送信</button>
      </div>
      <div id="output" style="overflow: auto; height: 300px"></div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script type="module">
      // Import the functions you need from the SDKs you need
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
      import { getDatabase, ref, push, set, onChildAdded, remove, onChildRemoved } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";
      // Your web app's Firebase configuration
      const firebaseConfig = {
        apiKey: "*********************************",
        authDomain: "****[ Your Firebase KEY ]****",
        databaseURL: "****************************",
        projectId: "**********",
        storageBucket: "**************************",
        messagingSenderId: "**********************",
        appId: "**********************************",
      };
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app); //RealtimeDBに接続
      const dbRef = ref(db, "chat"); //RealtimeDB内の"chat"を使う

      //データ登録(Click)
      $("#send").on("click", function () {
        const message = {
          userName: $("#userName").val(),
          text: $("#text").val(),
        };
        const newPostRef = push(dbRef); //ユニークKEYを生成
        set(newPostRef, message); //"chat"にユニークKEYをつけてオブジェクトデータを登録
      });

      //データ登録(Enter)
      $("#text").on("keydown", function (e) {
        console.log(e); //e変数の中身を確認！！
        if (e.keyCode == 13) {
          //EnterKey=13
          const message = {
            userName: $("#userName").val(),
            text: $("#text").val(),
          };
          const newPostRef = push(dbRef); //ユニークKEYを生成
          set(newPostRef, message); //"chat"にユニークKEYをつけてオブジェクトデータを登録
        }
      });

      //最初にデータ取得＆onSnapshotでリアルタイムにデータを取得
      onChildAdded(dbRef, function (data) {
        const message = data.val(); // 送られてきた中身 { userName, text } を取り出す
        const key = data.key; // 一意のキー（削除・更新に使える）
        //表示用テキスト・HTMLを作成（テンプレートリテラル）
        const h = `<p>${message.userName}<br>${message.text}</p>`;
        $("#output").append(h); //#outputの最後に追加
      });
    </script>
  </body>
</html>
