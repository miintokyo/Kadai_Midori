<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAMA</title>
    <link rel="stylesheet" href="yama_style.css">
</head>
<body>
    <h1>Yama DB</h1>

<div class="top">
    <form action="/submit" method="post" class="form">
        <div class="yamaName">
            <label for="name">Yama Name:</label>
            <input type="text" name="yamaName" id="yamaName">
        </div>

        <div class="yamaDetail">
            <div class="Info">
                <label for="Info">Info:</label>
                <textarea name="Info" id="yamaInfo"></textarea>
            </div>
            <div class="Trips">
                <label for="Trips">Trips:</label>
                <textarea name="Trips" id="yamaTrips"></textarea>
            </div>
        </div>

        <!-- <label for="level">Level:</label>
        <input type="radio" name="level" id="level">Advanced -->
    </form>
    
    <div class="button">
        <button type="button" id="saveBtn">Save</button>
        <button type="button" id="clearBtn">Clear form</button>            
    </div>
</div>

<div class="db">

    <div class="selectRecords">
        <h3>Database Records:</h3>

        <!-- <div class="dropdown">
            <select name="yamas" id="yamas">
                <option value=""></option>
            </select>
        </div> -->
    </div>
    
    <div class="yamaTable">

    </div>
</div>

    
    <script src="yama_script.js"></script>
</body>
</html>
