<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friend Journal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="app">
        <aside class="sidebar">
            <h1>Friend list</h1>
            <div class="input-area">
                <input id="nameinput" type="text" placeholder="Name">
                <button id="addFriend" type="button">Add</button>                
            </div>
            <div id="friendList">

            </div>
        </aside>

        <div class="profile-record">
            <h2>Profile:</h2>
            <textarea name="profile" id="profileMemo"></textarea>

        </div>
        <article class="journal-record">
            <h2>Interactions:</h2>
            <textarea name="interactions" id="interactionMemo" placeholder="Date, Activity, etc"></textarea>
        </div>

                <h1>Journal list</h1>
                </div>
        </main>
        <article class="journal-record">
            <h1>Journal Record</h1>
        </article> -->
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
